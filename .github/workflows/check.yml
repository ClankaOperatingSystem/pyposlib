name: check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Test against the poslib that has the matching protocol and fixtures.
      POSLIB_REF: 31365f5aad183ab9178fdab0e2a9b839c5cca910
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: purcell/setup-emacs@master
        with:
          version: 30.1
      - run: python -m pip install "PyYAML>=6.0"
      - run: make check
      - name: Install kubo, for offline hashing only
        env:
          KUBO: v0.43.1
        run: |
          curl -fsSLO https://github.com/ipfs/kubo/releases/download/$KUBO/kubo_${KUBO}_linux-amd64.tar.gz
          curl -fsSL https://github.com/ipfs/kubo/releases/download/$KUBO/kubo_${KUBO}_linux-amd64.tar.gz.sha512 | sha512sum -c
          tar -xzf kubo_${KUBO}_linux-amd64.tar.gz
      - run: make check-ipfs IPFS=kubo/ipfs
